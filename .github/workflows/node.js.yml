name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, "lts/*", "latest"]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true

    # node 18 is the minimum supported runtime: install only the runtime dependencies
    # and run the tests using the built-in node test runner
    - name: Install runtime dependencies (node 18)
      if: ${{ matrix.node-version == 18 }}
      run: npm ci --omit=dev
    # development tooling (eslint, c8) requires node LTS
    - name: Install dependencies
      if: ${{ matrix.node-version != 18 }}
      run: npm ci

    - run: npm run sizewatcher
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Test (node 18)
      if: ${{ matrix.node-version == 18 }}
      run: npm test
    - name: Test with coverage
      if: ${{ matrix.node-version != 18 }}
      run: npm run coverage
    - name: Lint
      if: ${{ matrix.node-version != 18 }}
      run: npm run lint

    - name: Coveralls
      uses: coverallsapp/github-action@master
      if: ${{ matrix.node-version == 'lts/*' }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
